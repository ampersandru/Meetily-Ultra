name: Release Meetily Ultra
on:
  workflow_dispatch:
    inputs:
      reuse_intel_run:
        description: 'Optional prior verified Intel artifact run; application sources must match'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm dlx bun@1.3.10 scripts/test-isolated.mjs
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
      - run: pnpm exec tsc --noEmit
        working-directory: frontend
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      NEXT_TELEMETRY_DISABLED: '1'
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-x64' || inputs.reuse_intel_run == ''
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        if: matrix.platform != 'macos-x64' || inputs.reuse_intel_run == ''
        with:
          workspaces: '. -> target'
          prefix-key: ${{ runner.os == 'macOS' && 'ultra-macos-sdkclean-v2' || 'v0-rust' }}
          key: ultra-${{ matrix.target }}-v1
          cache-targets: ${{ runner.os != 'macOS' }}
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io' || '' }}
          cache-on-failure: true
      - name: Install frontend dependencies
        if: matrix.platform != 'macos-x64' || inputs.reuse_intel_run == ''
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build and verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./frontend/scripts/build-ultra-windows.ps1
      - name: Install OpenSSL headers
        if: runner.os == 'macOS' && (matrix.platform != 'macos-x64' || inputs.reuse_intel_run == '')
        run: brew list --versions openssl@3 >/dev/null || brew install openssl@3
      - name: Build and verify macOS
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          ULTRA_REUSE_INTEL_RUN: ${{ inputs.reuse_intel_run }}
          GH_TOKEN: ${{ github.token }}
        run: bash frontend/scripts/build-ultra-macos.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-${{ matrix.platform }}
          path: dist-ultra/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ultra-*
          merge-multiple: true
          path: dist-ultra
      - name: Publish verified installers together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          cd dist-ultra
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          for asset in "Meetily-Ultra_${VERSION}_windows-x64-setup.exe" "Meetily-Ultra_${VERSION}_macos-arm64.dmg" "Meetily-Ultra_${VERSION}_macos-x64.dmg"; do
            test -s "$asset"
          done
          cd ..
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'A release with this version already exists; choose a new version.'
            exit 1
          fi
          gh release create "v$VERSION" dist-ultra/*.exe dist-ultra/*.dmg dist-ultra/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Meetily Ultra $VERSION" --notes-file docs/ULTRA_RELEASE_NOTES.md --draft
          gh release edit "v$VERSION" --draft=false --latest
